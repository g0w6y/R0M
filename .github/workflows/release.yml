name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build disk image
        run: scripts/make-dmg.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --title "R0M ${GITHUB_REF_NAME#v}" --generate-notes
          fi
